# GAIOP ISO release manifest (example)
#
# This is a build-time inventory, not an installer or a production config.
# Replace release placeholders in the ISO build pipeline.  Never place real
# credentials, certificates, private keys, webhook URLs, or customer data here.
schemaVersion: gaiop-iso-release-manifest/v1

release:
  id: REPLACE_WITH_RELEASE_ID
  builtFrom: 237-derived-baseline-image
  notes: >-
    The ISO build must pin the exact Admin, Upgrade, and Gateway source revisions
    in its build record. This manifest deliberately does not name a developer machine.

serviceAccount:
  user: gaiop
  group: gaiop

components:
  admin:
    sourceRepository: GAIOP-Admin
    targetDirectory: /opt/gaiop/admin
    requiredPaths:
      - server/index.js
      - server/admin-retention-cleanup.js
      - server/report-retention-cleanup.js
      - server/session-retention-cleanup.js
      - server/sqlite-backup.js
      - server/sqlite-restore-test.js
      - server/storage-watermark-monitor.js
      - deploy/iso/storage-watermark/managed-roots.json
      - dist/index.html
    serviceUnit: gaiop-admin.service
  upgrade:
    sourceRepository: GAIOP-upgrade
    targetDirectory: /opt/gaiop/upgrade
    requiredPaths:
      - src/index.js
      - src/retention-cleanup.js
      - src/sqlite-backup.js
      - src/sqlite-restore-test.js
    serviceUnit: gaiop-upgrade.service
  gateway:
    sourceRepository: GAIOP-latest
    targetDirectory: /opt/gaiop/gateway
    requiredPaths:
      - package.json
      - scripts/run_application_log_retention.js
      - skills/openclaw-napm-packet-analysis/scripts/run_packet_retention.js
      - skills/openclaw-napm-syslog-receiver/scripts/import_alerts_jsonl.js
      - skills/openclaw-napm-syslog-receiver/scripts/run_alert_retention.js
      - skills/openclaw-napm-report
      - skills/openclaw-napm-syslog-receiver
    serviceUnit: gaiop-gateway.service
  syslogReceiver:
    sourceRepository: GAIOP-latest
    targetDirectory: /opt/gaiop/gateway/skills/openclaw-napm-syslog-receiver
    serviceUnit: gaiop-syslog-receiver.service
  reverseProxy:
    configurationTemplate: GAIOP-Admin/deploy/iso/nginx/gaiop.conf
    validationCommand: nginx -t
  systemEntryLogRetention:
    caddyAccessLogTemplate: GAIOP-Admin/deploy/iso/caddy/gaiop-access-log.caddy
    rawSyslogTemplate: GAIOP-Admin/deploy/iso/logrotate/gaiop-netinside-syslog
    journalTemplate: GAIOP-Admin/deploy/iso/journald/60-gaiop-retention.conf

controlledFiles:
  environmentExamples:
    - source: GAIOP-Admin/deploy/iso/env/admin.env.example
      target: /etc/gaiop/admin.env
    - source: GAIOP-latest/deploy/iso/env/gateway.env.example
      target: /etc/gaiop/gateway.env
    - source: GAIOP-latest/deploy/iso/env/alert-receiver.env.example
      target: /etc/gaiop/alert-receiver.env
    - source: GAIOP-upgrade/deploy/env/gaiop-upgrade.env.example
      target: /etc/gaiop/upgrade.env
  serviceUnits:
    - source: GAIOP-Admin/deploy/iso/systemd/gaiop-admin.service
      target: /etc/systemd/system/gaiop-admin.service
    - source: GAIOP-latest/deploy/iso/systemd/gaiop-gateway.service
      target: /etc/systemd/system/gaiop-gateway.service
    - source: GAIOP-latest/skills/openclaw-napm-syslog-receiver/scripts/gaiop-syslog-receiver.service
      target: /etc/systemd/system/gaiop-syslog-receiver.service
    - source: GAIOP-Admin/deploy/systemd/gaiop-admin-retention-cleanup.service
      target: /etc/systemd/system/gaiop-admin-retention-cleanup.service
    - source: GAIOP-Admin/deploy/systemd/gaiop-admin-retention-cleanup.timer
      target: /etc/systemd/system/gaiop-admin-retention-cleanup.timer
    - source: GAIOP-Admin/deploy/systemd/gaiop-report-retention-cleanup.service
      target: /etc/systemd/system/gaiop-report-retention-cleanup.service
    - source: GAIOP-Admin/deploy/systemd/gaiop-report-retention-cleanup.timer
      target: /etc/systemd/system/gaiop-report-retention-cleanup.timer
    - source: GAIOP-Admin/deploy/systemd/gaiop-admin-session-retention.service
      target: /etc/systemd/system/gaiop-admin-session-retention.service
    - source: GAIOP-Admin/deploy/systemd/gaiop-admin-session-retention.timer
      target: /etc/systemd/system/gaiop-admin-session-retention.timer
    - source: GAIOP-Admin/deploy/systemd/gaiop-admin-sqlite-backup.service
      target: /etc/systemd/system/gaiop-admin-sqlite-backup.service
    - source: GAIOP-Admin/deploy/systemd/gaiop-admin-sqlite-backup.timer
      target: /etc/systemd/system/gaiop-admin-sqlite-backup.timer
    - source: GAIOP-Admin/deploy/systemd/gaiop-storage-watermark-monitor.service
      target: /etc/systemd/system/gaiop-storage-watermark-monitor.service
    - source: GAIOP-Admin/deploy/systemd/gaiop-storage-watermark-monitor.timer
      target: /etc/systemd/system/gaiop-storage-watermark-monitor.timer
    - source: GAIOP-upgrade/deploy/systemd/gaiop-upgrade-retention-cleanup.service
      target: /etc/systemd/system/gaiop-upgrade-retention-cleanup.service
    - source: GAIOP-upgrade/deploy/systemd/gaiop-upgrade-retention-cleanup.timer
      target: /etc/systemd/system/gaiop-upgrade-retention-cleanup.timer
    - source: GAIOP-upgrade/deploy/systemd/gaiop-upgrade-sqlite-backup.service
      target: /etc/systemd/system/gaiop-upgrade-sqlite-backup.service
    - source: GAIOP-upgrade/deploy/systemd/gaiop-upgrade-sqlite-backup.timer
      target: /etc/systemd/system/gaiop-upgrade-sqlite-backup.timer
    - source: GAIOP-latest/deploy/systemd/gaiop-backend-packet-retention.service
      target: /etc/systemd/system/gaiop-backend-packet-retention.service
    - source: GAIOP-latest/deploy/systemd/gaiop-backend-packet-retention.timer
      target: /etc/systemd/system/gaiop-backend-packet-retention.timer
    - source: GAIOP-latest/deploy/systemd/gaiop-backend-application-log-retention.service
      target: /etc/systemd/system/gaiop-backend-application-log-retention.service
    - source: GAIOP-latest/deploy/systemd/gaiop-backend-application-log-retention.timer
      target: /etc/systemd/system/gaiop-backend-application-log-retention.timer
    - source: GAIOP-latest/skills/openclaw-napm-syslog-receiver/scripts/gaiop-alert-retention.service
      target: /etc/systemd/system/gaiop-alert-retention.service
    - source: GAIOP-latest/skills/openclaw-napm-syslog-receiver/scripts/gaiop-alert-retention.timer
      target: /etc/systemd/system/gaiop-alert-retention.timer
    - source: GAIOP-latest/skills/openclaw-napm-syslog-receiver/scripts/gaiop-alert-jsonl-import.service
      target: /etc/systemd/system/gaiop-alert-jsonl-import.service
  systemEntryLogRetention:
    - source: GAIOP-Admin/deploy/iso/caddy/gaiop-access-log.caddy
      target: /etc/caddy/gaiop-access-log.caddy
      retention: 365 days
    - source: GAIOP-Admin/deploy/iso/logrotate/gaiop-netinside-syslog
      target: /etc/logrotate.d/gaiop-netinside-syslog
      retention: 365 days
    - source: GAIOP-Admin/deploy/iso/journald/60-gaiop-retention.conf
      target: /etc/systemd/journald.conf.d/60-gaiop-retention.conf
      retention: 180 days
  preflight:
    source: GAIOP-Admin/deploy/iso/scripts/gaiop-preflight.sh
    purpose: Read-only post-install validation

persistentData:
  - path: /var/lib/gaiop/admin
    purpose: Admin SQLite, configuration, audit, and session state
    backup: required
  - path: /var/lib/gaiop/alerts
    purpose: Normalized Syslog events and receiver state
    backup: required
  - path: /var/lib/gaiop/reports
    purpose: Formal DOCX reports and paired audit JSON files
    backup: required
  - path: /var/lib/gaiop/runtime
    purpose: Runtime data-source bridge; may contain protected credentials
    backup: required
  - path: /var/lib/gaiop/report-recovery
    purpose: Recoverable formal-report quarantine controlled by Admin metadata
    backup: required
  - path: /var/lib/gaiop/upgrade
    purpose: Upgrade SQLite, packages, staging, and component-owned SQLite backups
    backup: required
  - path: /var/backups/gaiop/upgrade
    purpose: Component upgrade rollback backups, separate from upgrade SQLite backups
    backup: required
  - path: /var/log/gaiop
    purpose: Application logs
    backup: retention-policy

firstBoot:
  requiredSecretFiles:
    - /etc/gaiop/admin.env
    - /etc/gaiop/gateway.env
    - /etc/gaiop/alert-receiver.env
    - /etc/gaiop/upgrade.env
  generatedOnTarget:
    - Linux-target Node.js dependencies and production frontend build, unless the ISO pipeline provides target-compatible artifacts
    - TLS certificate/key material and reverse-proxy activation
  operatorActions:
    - Inject secrets through the approved deployment secret process
    - Verify ownership and restrictive permissions for /etc/gaiop/*.env
    - Run the read-only preflight, then systemd and Nginx validation
    - Perform the ISO acceptance matrix before production handover

networkBoundary:
  external:
    - HTTPS 443 through the reverse proxy
    - Syslog UDP listener defined by the ISO rsyslog configuration
  loopbackOnly:
    - GAIOP Admin BFF
    - GAIOP Gateway 18789
    - GAIOP Syslog receiver 19090

excludedFromIsoRepository:
  - Real environment files, secrets, certificates, and private keys
  - Customer reports, alert events, SQLite state, runtime bridge state, and logs
  - Developer-machine node_modules or absolute developer-machine paths
  - SSH tunnel configuration and historical SSH alert-reading settings

deferredDecisions:
  - Exact operating-system, Node.js, and package-version lock
  - TLS certificate issuance and renewal design
  - Log backup frequency, media, encryption, and restore target
  - Final rsyslog listen address and firewall scope
  - Live Caddy site merge point, Caddy service account, and access-log directory ownership
  - Live Syslog file identity/ownership and Syslog receiver service-manager scope
